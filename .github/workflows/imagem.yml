name: imagem

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # O runner padrão tem ~14 GB livres e esta imagem passa disso com folga (torch + CUDA + pesos do
      # modelo). Sem esta limpeza o build morre por disco cheio, e o erro aparece no meio do push —
      # longe da causa.
      - name: liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      # A fumaça roda A IMAGEM QUE ACABOU DE SER CONSTRUÍDA, em CPU. É a diferença entre "a imagem
      # construiu" e "o worker fala": o card do Hub construía e morria no import do handler.
      - name: fumaça (o worker fala?)
        run: docker run --rm ghcr.io/${{ github.repository }}:latest python teste.py
